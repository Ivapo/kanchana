# Deploy Kanchana to GitHub Pages.
#
# We don't need a build step (no bundler), so the workflow is:
#   1. Run `bun test` — never deploy a red suite.
#   2. Stage the runtime files into `_site/` (exclude tests, scripts,
#      docs we don't want served, etc).
#   3. Upload + deploy via the official Pages actions.
#
# The `pages: write` + `id-token: write` permissions plus a single
# `github-pages` concurrency group are the required incantation for the
# v3/v4 Pages actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run tests
        run: bun test

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r src styles icons _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        # enablement:true lets the first run turn Pages on for the repo
        # without us having to click through Settings → Pages first.
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kanchana">
  <!--
    Kanchana icon: a glowing lamp disc. Radial gradient warm-white core
    fading into a dark navy field. Round to look right at any iOS mask shape.
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%"  stop-color="#FFE8B6"/>
      <stop offset="35%" stop-color="#FFB46B"/>
      <stop offset="75%" stop-color="#7A3A18"/>
      <stop offset="100%" stop-color="#0F1220"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="#0F1220"/>
  <circle cx="256" cy="252" r="200" fill="url(#glow)"/>
</svg>
